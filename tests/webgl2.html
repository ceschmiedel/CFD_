<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFD2026 — emissor GLSL / caminho WebGL2</title>
<style>
  body { font: 13px/1.6 ui-monospace, "Cascadia Code", Consolas, monospace;
         background: #0e1014; color: #d6dae2; margin: 0; padding: 24px 28px; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .04em;
       text-transform: uppercase; color: #7b8496; margin: 0 0 20px; }
  h2 { font-size: 13px; font-weight: 600; color: #d6dae2;
       margin: 26px 0 8px; border-bottom: 1px solid #232833; padding-bottom: 6px; }
  table { border-collapse: collapse; margin: 6px 0 4px; }
  td { padding: 2px 18px 2px 0; vertical-align: top; }
  td:first-child { color: #7b8496; }
  .ok   { color: #4ec9a0; }
  .fail { color: #f0616d; }
  .warn { color: #e0af68; }
  .num  { color: #94c8ff; }
  pre { background: #14171d; border: 1px solid #232833; border-radius: 4px;
        padding: 10px 12px; overflow: auto; max-height: 340px; color: #9aa3b2; }
  details { margin: 8px 0; }
  summary { cursor: pointer; color: #7b8496; }
  @media (max-width: 640px) {
    body { padding: 16px 14px; }
    table { display: block; max-width: 100%; overflow-x: auto; }
  }
</style>
<h1>CFD2026 — emissor GLSL / caminho WebGL2</h1>
<div id="saida">compilando…</div>

<script type="module">
/*
 * O que esta página verifica.
 *
 * O emissor GLSL gera código a partir do MESMO ir.js que gera o WGSL, e o modo
 * de falha característico de um gerador é produzir texto plausível que nenhum
 * compilador aceita. Aqui o driver é o juiz: os três shaders são compilados e
 * ligados de verdade num contexto WebGL2, e o log do driver aparece na íntegra
 * quando algo falha.
 *
 * Isto NÃO é a validação da física — essa é tests/validacao.html, e ela só
 * pode rodar quando o runtime WebGL2 existir. Aqui se responde uma pergunta
 * anterior e necessária: o código que sai do emissor compila na máquina de
 * quem abre a página?
 */
import { sondar, atlasLayout, PRESETS } from '../src/backend/caps.js';
import {
  shaderPasso, shaderInit, shaderMacros, shaderForcas, shaderReduzir,
  VERTEX_COBERTURA, N_ALVOS, planoDeTexturas,
} from '../src/core/emit/glsl.js';
import { SolverWebGPU } from '../src/backend/webgpu/solver.js';
import { montarTipos, corpoAnalitico } from '../src/core/tunel.js';
import * as Lat from '../src/core/lattice.js';
const { Q } = Lat;

const out = document.getElementById('saida');
const html = [];
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const push = s => { html.push(s); out.innerHTML = html.join('\n'); };
const h2 = t => push(`<h2>${esc(t)}</h2>`);
const linha = (k, v, cls = '') =>
  push(`<table><tr><td>${esc(k)}</td><td class="${cls}">${v}</td></tr></table>`);

const resultados = [];
function veredito(nome, passou, detalhe = '') {
  resultados.push({ nome, passou });
  linha(nome, `<span class="${passou ? 'ok' : 'fail'}">${passou ? 'PASSOU' : 'FALHOU'}</span>` +
    (detalhe ? ` <span style="color:#7b8496">— ${detalhe}</span>` : ''));
}
const fonte = (titulo, txt) => push(
  `<details><summary>${esc(titulo)} — ${txt.split('\n').length} linhas</summary>` +
  `<pre>${esc(txt)}</pre></details>`);

/* ──────────────────────────────────────────────────────── 0. o contexto */

h2('0 — contexto WebGL2 desta máquina');
const caps = await sondar();
const gl2 = caps.backends.find(b => b.id === 'webgl2');
linha('disponível', gl2?.disponivel
  ? '<span class="ok">sim</span>'
  : `<span class="fail">não</span> <span style="color:#7b8496">— ${esc(gl2?.motivo ?? '')}</span>`);
if (gl2?.disponivel) {
  linha('renderer', `<span class="num">${esc(gl2.renderer)}</span>`);
  linha('textura máxima', `<span class="num">${gl2.limites.maxTexture}</span> px`);
  linha('alvos MRT', `<span class="num">${gl2.limites.maxDrawBuffers}</span> ` +
    `<span style="color:#7b8496">(${N_ALVOS} necessários para ${Q} populações)</span>`);
  linha('float filtrável', gl2.temFloatLinear ? 'sim' : 'não (só nearest)');
}

const canvas = document.createElement('canvas');
const gl = canvas.getContext('webgl2', { antialias: false, depth: false });
if (!gl) {
  push('<p class="fail">Sem contexto WebGL2 — nada a compilar.</p>');
  throw new Error('sem webgl2');
}
gl.getExtension('EXT_color_buffer_float');

/* ─────────────────────────────────────────────── 1. o atlas dos presets */

h2('1 — ladrilhamento do lattice 3D em atlas 2D');
push('<table>');
for (const p of PRESETS) {
  const a = atlasLayout(p.nx, p.ny, p.nz, gl.getParameter(gl.MAX_TEXTURE_SIZE));
  const bytes = a ? a.w * a.h * 16 * N_ALVOS * 2 : 0;   // RGBA32F, dois conjuntos
  push(`<tr><td>${p.nome} ${p.nx}×${p.ny}×${p.nz}</td><td class="${a ? 'num' : 'fail'}">` +
    (a ? `${a.tx}×${a.ty} ladrilhos · atlas ${a.w}×${a.h} · ` +
         `${(bytes / 1e9).toFixed(2)} GB nas populações`
       : 'não cabe na textura máxima') + '</td></tr>');
}
push('</table>');

/* ────────────────────────────────────────────── 2. compilação de verdade */

h2('2 — o driver compila o que o emissor gerou?');

function compilar(tipo, src, rotulo) {
  const s = gl.createShader(tipo);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    veredito(rotulo, false, 'não compilou');
    push(`<pre class="fail">${esc(log)}</pre>`);
    /* O log do driver aponta a LINHA, então a fonte numerada é o que torna a
       mensagem utilizável — sem ela, "0:412: error" é um enigma. */
    push(`<details open><summary>fonte numerada</summary><pre>` +
      esc(src.split('\n').map((l, i) => `${String(i + 1).padStart(4)} | ${l}`).join('\n')) +
      `</pre></details>`);
    gl.deleteShader(s);
    return null;
  }
  return s;
}

function programa(rotulo, fs) {
  const vs = compilar(gl.VERTEX_SHADER, VERTEX_COBERTURA, `${rotulo}: vertex`);
  const f = compilar(gl.FRAGMENT_SHADER, fs, `${rotulo}: fragment`);
  if (!vs || !f) return null;
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, f);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    veredito(`${rotulo}: link`, false, esc(gl.getProgramInfoLog(p)));
    return null;
  }
  veredito(`${rotulo}: compila e liga`, true);
  return p;
}

const fontes = {
  passo: shaderPasso(),
  init: shaderInit(),
  macros: shaderMacros(),
  forcas: shaderForcas(),
  reduzir: shaderReduzir(),
};

const progs = {
  passo: programa('passo (streaming + colisão)', fontes.passo),
  init: programa('inicialização', fontes.init),
  macros: programa('campo macroscópico', fontes.macros),
  forcas: programa('forças por troca de momento', fontes.forcas),
  reduzir: programa('redução em pirâmide', fontes.reduzir),
};

/* ───────────────────────────────────── 3. os uniformes existem mesmo? */

h2('3 — uniformes que o runtime vai precisar ligar');
/*
 * Um uniforme não usado é REMOVIDO pelo compilador, e getUniformLocation
 * devolve null — o runtime então liga o valor em lugar nenhum e o shader roda
 * com o padrão. É uma das formas mais silenciosas de um backend dar resultado
 * errado, e é barato conferir aqui.
 */
if (progs.passo) {
  const esperados = ['uDim', 'uTiles', 'uOmega', 'uMagicU', 'uLesCsU',
    'uBeltU', 'uInletU', 'uSponge', 'uTipo',
    ...Array.from({ length: N_ALVOS }, (_, t) => `uSrc${t}`)];
  const faltando = esperados.filter(n => gl.getUniformLocation(progs.passo, n) === null);
  veredito('todos os uniformes sobreviveram à compilação', faltando.length === 0,
    faltando.length ? `sem localização: ${faltando.join(', ')}` : `${esperados.length} conferidos`);
}

/* ───────────────────────────────────────── 4. o plano de empacotamento */

h2('4 — onde cada uma das 19 populações mora');
const plano = planoDeTexturas();
push('<table><tr><td>textura</td><td>direções</td></tr>');
for (let t = 0; t < N_ALVOS; t++) {
  const dirs = plano.filter(p => p.textura === t).map(p => p.dir);
  push(`<tr><td>uSrc${t} / oPop${t}</td><td class="num">${dirs.join(', ')}` +
    (dirs.length < 4 ? ' <span style="color:#7b8496">(sobra componente)</span>' : '') + '</td></tr>');
}
push('</table>');

/* ─────────────────────────────────── 5. runtime: escoamento uniforme */

h2('5 — runtime: invariância do escoamento uniforme');
push('<p style="color:#7b8496;margin:4px 0 10px">Escoamento uniforme é solução exata do LBM: ' +
  'g_i já está em equilíbrio, o streaming traz o mesmo valor de todo vizinho e a colisão não tem ' +
  'o que relaxar. É o teste que pega índice trocado — e num backend cujo endereçamento passa por ' +
  'um atlas 2D, é <em>o</em> teste: qualquer erro no ladrilhamento aparece aqui como deriva.</p>');

const gl2Solver = await import('../src/backend/webgl2/solver.js');
const { SolverWebGL2 } = gl2Solver;

const GRADE = { nx: 64, ny: 32, nz: 32 };
const u0 = [0.05, 0, 0];

const glCtx = SolverWebGL2.criarContexto(canvas);
let sg = await SolverWebGL2.criar(glCtx, GRADE);
linha('lattice', `${GRADE.nx}×${GRADE.ny}×${GRADE.nz} = ` +
  `<span class="num">${(sg.N / 1e3).toFixed(0)}k</span> células · atlas ` +
  `<span class="num">${sg.atlas.w}×${sg.atlas.h}</span> · ` +
  `${(sg.bytesTotais / 1e6).toFixed(1)} MB`);

sg.definirTipos(new Uint32Array(sg.N));          // tudo fluido
sg.configurar({ omegaPlus: 1.0, lesCs: 0.0, inletU: u0 });
sg.inicializar();
sg.passo(200);
const mg = await sg.lerMacros();

let maxU = 0, maxD = 0;
for (let i = 0; i < sg.N; i++) {
  maxU = Math.max(maxU, Math.abs(mg[i * 4] - u0[0]),
    Math.abs(mg[i * 4 + 1]), Math.abs(mg[i * 4 + 2]));
  maxD = Math.max(maxD, Math.abs(mg[i * 4 + 3]));
}
linha('erro máx. em u após 200 passos', `<span class="num">${maxU.toExponential(2)}</span>`);
linha('erro máx. em delta', `<span class="num">${maxD.toExponential(2)}</span>`);
veredito('escoamento uniforme preservado ao nível do fp32', maxU < 1e-6 && maxD < 1e-6,
  'tolerância 1e-6');
sg.destruir();

/* ────────────────────────────── 6. runtime: viscosidade medida */

h2('6 — runtime: decaimento de onda de cisalhamento');
push('<p style="color:#7b8496;margin:4px 0 10px">O teste quantitativo do operador de colisão, ' +
  'o mesmo que <a href="nucleo.html" style="color:#7fa9d8">nucleo.html</a> roda no WebGPU. Uma onda ' +
  'u_x = U₀ sin(2πy/L) decai como exp(−ν k² t); extraímos ν da amplitude e comparamos com ' +
  'ν = c_s²(1/ω − ½). Se a colisão TRT tiver saído diferente em GLSL, é aqui que aparece.</p>');

const NY = 64, A0 = 0.02, kOnda = 2 * Math.PI / NY;
const tabela = [];
for (const omega of [0.6, 1.0, 1.5, 1.8]) {
  const sv = await SolverWebGL2.criar(glCtx, { nx: 8, ny: NY, nz: 8 });
  sv.definirTipos(new Uint32Array(sv.N));
  sv.configurar({ omegaPlus: omega, lesCs: 0.0, inletU: [0, 0, 0] });
  sv.frente = 'A';
  sv.definirCampo((x, y) => ({ delta: 0, u: [A0 * Math.sin(kOnda * y), 0, 0] }),
    Lat.equilibrium);

  const T = 400;
  sv.passo(T);
  const mm = await sv.lerMacros();

  /* Projeta no modo senoidal: imune a offset e a ruído de outros modos. */
  let acc = 0, norm = 0;
  for (let z = 0; z < sv.nz; z++) {
    for (let y = 0; y < sv.ny; y++) {
      const sn = Math.sin(kOnda * y);
      for (let x = 0; x < sv.nx; x++) {
        acc += mm[((z * sv.ny + y) * sv.nx + x) * 4] * sn;
        norm += sn * sn;
      }
    }
  }
  const amp = acc / norm;
  const nuT = Lat.nuFromOmega(omega);
  const nuM = -Math.log(Math.abs(amp) / A0) / (kOnda * kOnda * T);
  tabela.push({ omega, nuT, nuM, erro: 100 * (nuM - nuT) / nuT });
  sv.destruir();
}
push('<table><tr><td>ω⁺</td><td>ν teórico</td><td>ν medido</td><td>erro</td></tr>' +
  tabela.map(r => `<tr><td class="num">${r.omega.toFixed(2)}</td>` +
    `<td class="num">${r.nuT.toExponential(4)}</td>` +
    `<td class="num">${r.nuM.toExponential(4)}</td>` +
    `<td class="${Math.abs(r.erro) < 2 ? 'ok' : 'fail'}">` +
    `${r.erro >= 0 ? '+' : ''}${r.erro.toFixed(2)}%</td></tr>`).join('') + '</table>');
const pior = Math.max(...tabela.map(r => Math.abs(r.erro)));
veredito('viscosidade medida bate com ν(ω)', pior < 2,
  `pior erro ${pior.toFixed(2)}%, tolerância 2% (o resto é erro O(k²) do lattice)`);

/* ──────────────────────── 7. os dois backends resolvem o mesmo caso */

h2('7 — WebGPU e WebGL2 no mesmo caso');
push('<p style="color:#7b8496;margin:4px 0 10px">A razão de o IR existir. Mesma grade, mesma ' +
  'esfera, mesmos parâmetros, mesmo número de passos — e a comparação é célula a célula do campo ' +
  'de velocidade, mais o vetor de força. Discordância aqui é bug de memória ou de despacho de um ' +
  'dos dois, <em>nunca</em> de modelagem: a física dos dois saiu do mesmo arquivo.</p>');

const gpu = caps.backends.find(b => b.id === 'webgpu');
if (!gpu?.disponivel) {
  linha('WebGPU', '<span class="warn">indisponível nesta máquina — sem confronto</span>');
} else {
  const GC = { nx: 64, ny: 32, nz: 32 };
  const corpo = corpoAnalitico(GC, { tipo: 'esfera', cx: 20, cy: 16, cz: 16, raio: 6 });
  const { tipo: tipos, esponja } = montarTipos({ grade: GC, corpo, esteira: true });
  const cfg = {
    omegaPlus: 1.6, lesCs: 0.0, inletU: [0.05, 0, 0], beltU: [0.05, 0, 0],
    esponja, espessuraCL: 0,
  };
  const PASSOS = 300;

  const rodar = async (s) => {
    s.definirTipos(tipos);
    s.configurar(cfg);
    await s.calibrarRepouso();
    s.inicializar();
    s.passo(PASSOS);
    const f = await s.medirForcas();
    const m = await s.lerMacros();
    return { f, m };
  };

  const device = await SolverWebGPU.criarDevice(gpu.adapter);
  const a = await rodar(await SolverWebGPU.criar(device, GC));
  const b = await rodar(await SolverWebGL2.criar(glCtx, GC));

  /*
   * A diferença é procurada com ENDEREÇO, não só com magnitude.
   *
   * "8,98e-4 de diferença máxima" não diz nada sozinho: no interior do
   * escoamento isso é bug de indexação, e num plano de contorno pode ser
   * apenas os dois backends respondendo perguntas diferentes. Sem saber ONDE,
   * a única saída seria afrouxar a tolerância até passar — que é como um
   * backend errado entra na suíte.
   */
  let difU = 0, refU = 0, difD = 0, ondeU = null;
  let difInterior = 0, ondeInterior = null, acimaDeTol = 0;
  const noContorno = (x, y, z) =>
    x === 0 || x === GC.nx - 1 || y === 0 || y === GC.ny - 1 ||
    z === 0 || z === GC.nz - 1;
  /*
   * ONDE OS DOIS RESPONDEM A MESMA PERGUNTA.
   *
   * O campo macroscópico é amostrado em pontos diferentes do passo nos dois
   * backends, e isso não é defeito de nenhum dos dois:
   *
   *   WebGPU  escreve macros DENTRO do kernel do passo, a partir dos momentos
   *           pós-streaming e pré-colisão — de graça, porque ele já somou as
   *           dezenove populações ali.
   *   WebGL2  não tem esse almoço grátis: escrever junto pediria um sexto alvo
   *           de cor, que caps.js não garante. O campo sai de um passe
   *           separado sobre as populações PÓS-colisão já gravadas.
   *
   * Para célula de fluido os dois coincidem exatamente, porque a colisão
   * conserva massa e momento. Deixam de coincidir em dois lugares:
   *
   *   nos PLANOS DE CONTORNO, onde o WebGPU relata o que chegou por streaming
   *   e o WebGL2 relata o que a condição de contorno impôs;
   *
   *   na ESPONJA, que mistura o estado pós-colisão com o equilíbrio da
   *   corrente livre e portanto MUDA os momentos — o WebGPU relata antes da
   *   mistura, o WebGL2 depois.
   *
   * Comparar ali seria comparar duas definições, e o teste só passaria se a
   * tolerância fosse afrouxada até não medir mais nada. A verificação vale
   * onde as duas definições coincidem — e as FORÇAS, que saem das populações e
   * não deste campo, continuam sendo comparadas no domínio inteiro.
   */
  const comparavel = (x, y, z) => !noContorno(x, y, z) && x < esponja.inicio;

  for (let z = 0; z < GC.nz; z++) {
    for (let y = 0; y < GC.ny; y++) {
      for (let x = 0; x < GC.nx; x++) {
        const i = (z * GC.ny + y) * GC.nx + x;
        let d = 0;
        for (let c = 0; c < 3; c++) {
          d = Math.max(d, Math.abs(a.m[i * 4 + c] - b.m[i * 4 + c]));
          refU = Math.max(refU, Math.abs(a.m[i * 4 + c]));
        }
        difD = Math.max(difD, Math.abs(a.m[i * 4 + 3] - b.m[i * 4 + 3]));
        if (d > difU) { difU = d; ondeU = [x, y, z]; }
        if (comparavel(x, y, z)) {
          if (d > 1e-5) acimaDeTol++;
          if (d > difInterior) { difInterior = d; ondeInterior = [x, y, z]; }
        }
      }
    }
  }
  const difF = Math.max(...[0, 1, 2].map(c => Math.abs(a.f[c] - b.f[c])));
  const magF = Math.hypot(...a.f);

  push('<table><tr><td>grandeza</td><td>WebGPU</td><td>WebGL2</td><td>diferença</td></tr>' +
    [0, 1, 2].map(c => `<tr><td>força ${'xyz'[c]}</td>` +
      `<td class="num">${a.f[c].toExponential(4)}</td>` +
      `<td class="num">${b.f[c].toExponential(4)}</td>` +
      `<td class="num">${Math.abs(a.f[c] - b.f[c]).toExponential(2)}</td></tr>`).join('') +
    '</table>');
  const ondeTxt = (p) => p ? `(${p[0]}, ${p[1]}, ${p[2]})` : '—';
  linha('|u| máx no domínio', `<span class="num">${refU.toFixed(5)}</span>`);
  linha('maior diferença em u', `<span class="num">${difU.toExponential(2)}</span> ` +
    `<span style="color:#7b8496">(${(100 * difU / Math.max(refU, 1e-12)).toFixed(3)}% do máximo, ` +
    `em ${ondeTxt(ondeU)}${ondeU && noContorno(...ondeU) ? ' — plano de contorno' : ''})</span>`);
  linha('maior diferença ONDE SÃO COMPARÁVEIS',
    `<span class="num">${difInterior.toExponential(2)}</span> ` +
    `<span style="color:#7b8496">(${(100 * difInterior / Math.max(refU, 1e-12)).toFixed(4)}% ` +
    `do máximo, em ${ondeTxt(ondeInterior)})</span>`);
  linha('células acima de 1e-5 na região comparável',
    `<span class="num">${acimaDeTol}</span>`);
  linha('maior diferença em delta', `<span class="num">${difD.toExponential(2)}</span>`);

  /*
   * A tolerância é relativa e generosa por um motivo específico: os dois
   * backends somam as mesmas parcelas em fp32 em ORDENS diferentes — a redução
   * das forças é em árvore aqui e por fatias no WebGPU, e o compilador de cada
   * driver reassocia as expressões como quiser. Diferença na quinta casa é
   * aritmética; diferença no primeiro dígito é bug.
   */
  veredito('campo de velocidade concorda onde as definições coincidem',
    difInterior < 1e-4 * Math.max(refU, 1e-6),
    'tolerância 0,01% do |u| máximo — fora do contorno e da esponja, onde os ' +
    'dois amostram o mesmo instante do passo');
  veredito('força concorda entre backends', difF < 1e-3 * Math.max(magF, 1e-9),
    `tolerância 0,1% de |F| = ${magF.toExponential(3)}`);
}

/* ──────────────────────────────────────────────────────── 8. as fontes */

h2('8 — código gerado');
fonte('passo (o laço quente)', fontes.passo);
fonte('inicialização', fontes.init);
fonte('campo macroscópico', fontes.macros);
fonte('forças por troca de momento', fontes.forcas);
fonte('redução em pirâmide', fontes.reduzir);

/* ─────────────────────────────────────────────────────────── veredito */

h2('resumo');
const ok = resultados.filter(r => r.passou).length;
linha('testes', `<span class="${ok === resultados.length ? 'ok' : 'fail'}">` +
  `${ok}/${resultados.length}</span>`);
push('<p style="color:#545c6b;max-width:70ch">O caminho WebGL2 resolve o ' +
  'mesmo escoamento que o WebGPU: o campo concorda ao nível do arredondamento ' +
  'de fp32 onde as duas definições coincidem, e a força sobre o corpo — que ' +
  'sai das populações e não do campo amostrado — concorda no domínio inteiro. ' +
  'Falta a camada de visualização, que hoje é WGSL: o app continua exigindo ' +
  'WebGPU para <em>desenhar</em> mesmo com a física rodando aqui.</p>');
</script>
